version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
    groups:
      # Majors are excluded from the group so one breaking major (e.g. a
      # TypeScript-style ecosystem shift) cannot wedge the whole batch;
      # each major arrives as its own reviewable PR instead.
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
      - frontend
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      # init and analyze are subpaths of one action and must run the same
      # version, or analyze fails with "Loaded a configuration file for
      # version X, but running version Y". Ungrouped, Dependabot raises one
      # PR per subpath and neither can pass CI alone.
      codeql-action:
        patterns:
          - "github/codeql-action*"
